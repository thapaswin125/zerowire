name: Publish selected drafts

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  promote:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'daily-digest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write merged PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.md

      - name: Apply selections
        run: python scripts/apply_selections.py --body-file /tmp/pr-body.md

      - name: Commit promoted posts
        run: |
          git config user.name "zerowire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts _staging
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "feat: publish selected digest items"
            git push origin main
          fi
