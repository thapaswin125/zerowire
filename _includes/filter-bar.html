<div class="zw-filters" role="group" aria-label="Filter feed by severity">
  <button class="zw-filter active" data-filter="all">All</button>
  <button class="zw-filter zw-filter-critical" data-filter="critical">Critical</button>
  <button class="zw-filter zw-filter-high" data-filter="high">High</button>
  <button class="zw-filter zw-filter-medium" data-filter="medium">Medium</button>
  <button class="zw-filter zw-filter-low" data-filter="low">Low</button>
  <button class="zw-filter zw-filter-info" data-filter="info">Info</button>
  <button class="zw-filter zw-filter-kev" data-filter="kev">KEV only</button>
</div>
